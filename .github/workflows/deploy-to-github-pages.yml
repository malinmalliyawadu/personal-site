name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
